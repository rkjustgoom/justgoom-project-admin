<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Just Goom</title>
  <link rel="stylesheet" href="../assets/css/users.css">
</head>
<body class="user-panel-body" data-page="profile" data-title="My Profile">
<div class="user-sidebar-overlay"></div>
<div class="user-wrap">
  <aside class="user-sidebar" id="userSidebar"></aside>
  <div class="user-main">
    <header class="user-page-header">
      <div class="user-page-header-left">
        <button type="button" class="user-menu-btn" aria-label="Menu">☰</button>
        <h1 class="user-greeting"><strong data-user-name>Shree Gold Jewellers</strong></h1>
      </div>
      <span class="user-page-title">My Profile</span>
    </header>
    <div class="user-content">
      <div class="user-toolbar">
        <p class="user-text-muted">Profile completion required for Silver Plan onboarding — <strong class="user-text-accent">85%</strong> complete</p>
        <a href="../profile.html" target="_blank" class="user-btn user-btn-default">Preview Public Profile</a>
      </div>
      <div class="user-form-card">
        <form>
          <div class="user-form-row">
            <div class="user-form-group"><label>Business Name *</label><input type="text" class="user-form-control" value="Shree Gold Jewellers"></div>
            <div class="user-form-group"><label>Category *</label><select class="user-form-control"><option selected>Jewellery &amp; Bullion</option><option>Real Estate</option><option>Manufacturing</option></select></div>
          </div>
          <div class="user-form-group"><label>Tagline</label><input type="text" class="user-form-control" value="Premium 22K Gold Jewellery · Wholesale &amp; Retail"></div>
          <div class="user-form-group"><label>About Business *</label><textarea class="user-form-control" rows="4">Shree Gold Jewellers is a trusted name in Ahmedabad for premium 22K gold jewellery and wedding collections.</textarea></div>
          <div class="user-form-row">
            <div class="user-form-group"><label>Phone *</label><input type="tel" class="user-form-control" value="+91 98765 43210"></div>
            <div class="user-form-group"><label>Email *</label><input type="email" class="user-form-control" value="shreegold@example.com"></div>
          </div>
          <div class="user-form-group"><label>Address</label><input type="text" class="user-form-control" value="CG Road, Ahmedabad, Gujarat 380009"></div>
          <div class="user-form-row">
            <div class="user-form-group"><label>City *</label><input type="text" class="user-form-control" value="Ahmedabad"></div>
            <div class="user-form-group"><label>Plan</label><input type="text" class="user-form-control" value="Platinum Plan" readonly></div>
          </div>
          <button type="button" class="user-btn user-btn-primary" onclick="alert('Profile saved successfully!')">Save Profile</button>
        </form>
      </div>
    </div>
    <footer class="user-footer">© 2026 Just Goom LLP. Trademarks and brands are the property of their respective owners.</footer>
  </div>
</div>
<script src="../assets/js/users-nav.js"></script>
<script src="../assets/js/users.js"></script>
</body>
</html>
