<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification — Just Goom</title>
  <link rel="stylesheet" href="../assets/css/users.css">
</head>
<body class="user-panel-body user-crud-detail" data-page="notifications" data-module="notification" data-title="My Notification">

<div class="user-sidebar-overlay"></div>
<div class="user-wrap">
  <aside class="user-sidebar" id="userSidebar"></aside>
  <div class="user-main">
    <header class="user-page-header">
      <div class="user-page-header-left">
        <button type="button" class="user-menu-btn" aria-label="Menu">☰</button>
        <h1 class="user-greeting"><strong data-user-name>Shree Gold Jewellers</strong></h1>
      </div>
      <span class="user-page-title">My Notification</span>
    </header>
    <div class="user-content">
      <nav class="user-form-breadcrumb"><a href="notifications.html">My Notification</a> <span>/</span> <span>View</span></nav>
      <h2 class="user-form-page-title" data-crud-bind="title">—</h2>
      <p class="user-text-muted" style="margin-bottom:24px"><span data-crud-bind="type">—</span> · <span data-crud-bind="date">—</span></p>
      <div class="user-form-card user-form-card-wide">
        <p style="font-size:15px;line-height:1.7;color:var(--user-text)" data-crud-bind="body">—</p>
        <div class="user-form-actions">
          <div class="user-form-actions-left"><a href="#" data-crud-delete class="user-btn user-btn-danger">Dismiss</a></div>
          <a href="notifications.html" class="user-btn user-btn-default">Back</a>
        </div>
      </div>
    </div>
    <footer class="user-footer">© 2026 Just Goom LLP.</footer>
  </div>
</div>
<script src="../assets/js/users-nav.js"></script>
<script src="../assets/js/users.js"></script>
<script src="../assets/js/user-crud.js"></script>
</body>
</html>
