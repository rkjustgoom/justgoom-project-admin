<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reply Inquiry — Just Goom</title>
  <link rel="stylesheet" href="../assets/css/users.css">
</head>
<body class="user-panel-body user-crud-detail" data-page="inquiries" data-module="inquiry" data-title="My Inquiry">

<div class="user-sidebar-overlay"></div>
<div class="user-wrap">
  <aside class="user-sidebar" id="userSidebar"></aside>
  <div class="user-main">
    <header class="user-page-header">
      <div class="user-page-header-left">
        <button type="button" class="user-menu-btn" aria-label="Menu">☰</button>
        <h1 class="user-greeting"><strong data-user-name>Shree Gold Jewellers</strong></h1>
      </div>
      <span class="user-page-title">My Inquiry</span>
    </header>
    <div class="user-content">
      <nav class="user-form-breadcrumb"><a href="inquiries.html">My Inquiry</a> <span>/</span> <span>Reply</span></nav>
      <h2 class="user-form-page-title">Reply to Inquiry</h2>
      <div class="user-form-card user-form-card-wide">
        <div class="user-form-group"><label>To</label><input type="text" class="user-form-control" data-crud-bind="from" readonly></div>
        <div class="user-form-group"><label>Subject</label><input type="text" class="user-form-control" data-crud-bind="subject" readonly></div>
        <div class="user-form-group"><label>Original Message</label><textarea class="user-form-control" rows="4" data-crud-bind="message" readonly></textarea></div>
        <div class="user-form-group"><label>Your Reply *</label><textarea class="user-form-control" rows="6" placeholder="Write your response to the customer..."></textarea></div>
        <div class="user-form-actions">
          <a href="inquiries.html" class="user-btn user-btn-default">Cancel</a>
          <button type="button" class="user-btn user-btn-primary" data-crud-save>Send Reply</button>
        </div>
      </div>
    </div>
    <footer class="user-footer">© 2026 Just Goom LLP.</footer>
  </div>
</div>
<script src="../assets/js/user-crud.js"></script>
<script src="../assets/js/users-nav.js"></script>
<script src="../assets/js/users.js"></script>
</body>
</html>
