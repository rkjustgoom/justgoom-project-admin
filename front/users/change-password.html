<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Just Goom</title>
  <link rel="stylesheet" href="../assets/css/users.css">
</head>
<body class="user-panel-body" data-page="change-password" data-title="Change Password">
<div class="user-sidebar-overlay"></div>
<div class="user-wrap">
  <aside class="user-sidebar" id="userSidebar"></aside>
  <div class="user-main">
    <header class="user-page-header">
      <div class="user-page-header-left">
        <button type="button" class="user-menu-btn" aria-label="Menu">☰</button>
        <h1 class="user-greeting"><strong data-user-name>Shree Gold Jewellers</strong></h1>
      </div>
      <span class="user-page-title">Change Password</span>
    </header>
    <div class="user-content">
      <div class="user-form-card">
        <form>
          <div class="user-form-group"><label>Current Password</label><input type="password" class="user-form-control" placeholder="Enter current password"></div>
          <div class="user-form-group"><label>New Password</label><input type="password" class="user-form-control" placeholder="Enter new password"></div>
          <div class="user-form-group"><label>Confirm New Password</label><input type="password" class="user-form-control" placeholder="Confirm new password"></div>
          <button type="button" class="user-btn user-btn-primary">Update Password</button>
        </form>
      </div>
    </div>
    <footer class="user-footer">© 2026 Just Goom LLP. Trademarks and brands are the property of their respective owners.</footer>
  </div>
</div>
<script src="../assets/js/users-nav.js"></script>
<script src="../assets/js/users.js"></script>
</body>
</html>
