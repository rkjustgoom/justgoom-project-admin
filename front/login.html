<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Just Goom LLP</title>
  <meta name="description" content="Sign in to your Just Goom account — manage business listings, inquiries, and your B2B dashboard.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page-body auth-unified-page auth-login-page" data-page="login">

  <div id="site-header" data-include="header.html"></div>

  <section class="auth-page auth-page-unified">
    <div class="container">
      <div class="auth-unified-card auth-unified-wide">

        <div class="auth-form-header auth-form-header-center">
          <h1>Login</h1>
        </div>

        <form class="auth-form auth-form-compact" id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required>
          </div>
          <div class="auth-options">
            <label><input type="checkbox"> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>

      </div>
    </div>
  </section>

  <div id="site-footer" data-include="footer-mini.html"></div>

  <script src="assets/js/includes.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/users.js"></script>
</body>
</html>
