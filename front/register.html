<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Just Goom LLP</title>
  <meta name="description" content="Create your free Just Goom account — list your business, receive buyer inquiries, and grow your B2B presence.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page-body auth-unified-page auth-register-page" data-page="register">

  <div id="site-header" data-include="header.html"></div>

  <section class="auth-page auth-page-unified">
    <div class="container">
      <div class="auth-unified-card auth-unified-wide">

        <div class="auth-form-header auth-form-header-center">
          <h1>Create Your Account</h1>
        </div>

        <form class="auth-form auth-form-compact" id="registerForm">
          <div class="auth-form-row">
            <div class="form-group">
              <label for="regCompany">Company Name <span class="req">*</span></label>
              <input type="text" id="regCompany" name="company_name" class="form-input" placeholder="Your company name" required>
            </div>
            <div class="form-group">
              <label for="regSlug">Company Slug <span class="req">*</span></label>
              <input type="text" id="regSlug" name="company_slug" class="form-input" placeholder="your-company-name" required>
            </div>
          </div>
          <div class="auth-form-row">
            <div class="form-group">
              <label for="regCategory">Category <span class="req">*</span></label>
              <select id="regCategory" name="category" class="form-input" required>
                <option value="">Select category</option>
              </select>
            </div>
            <div class="form-group">
              <label for="regSubCategory">Sub Category <span class="req">*</span></label>
              <select id="regSubCategory" name="sub_category" class="form-input" required disabled>
                <option value="">Select sub category</option>
              </select>
            </div>
          </div>
          <div class="auth-form-row">
            <div class="form-group">
              <label for="regFname">First Name <span class="req">*</span></label>
              <input type="text" id="regFname" name="fname" class="form-input" placeholder="First name" required>
            </div>
            <div class="form-group">
              <label for="regLname">Last Name <span class="req">*</span></label>
              <input type="text" id="regLname" name="lname" class="form-input" placeholder="Last name" required>
            </div>
          </div>
          <div class="auth-form-row">
            <div class="form-group">
              <label for="regPhone">Mobile Number <span class="req">*</span></label>
              <div class="phone-input">
                <span class="phone-prefix">+91</span>
                <input type="tel" id="regPhone" name="mobile" class="form-input" placeholder="Mobile number" required>
              </div>
            </div>
            <div class="form-group">
              <label for="regEmail">Email Address <span class="req">*</span></label>
              <input type="email" id="regEmail" name="email" class="form-input" placeholder="you@example.com" required>
            </div>
          </div>
          <div class="auth-form-row">
            <div class="form-group">
              <label for="regPassword">Password <span class="req">*</span></label>
              <input type="password" id="regPassword" name="password" class="form-input" placeholder="Create password" required>
            </div>
            <div class="form-group">
              <label for="regConfirm">Confirm Password <span class="req">*</span></label>
              <input type="password" id="regConfirm" name="password_confirmation" class="form-input" placeholder="Confirm password" required>
            </div>
          </div>
          <div class="form-group">
            <label for="regReferral">Referral Code</label>
            <input type="text" id="regReferral" name="referral_code" class="form-input" placeholder="Enter referral code (optional)">
          </div>
          <label class="auth-terms">
            <input type="checkbox" required>
            I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
          </label>
          <button type="submit" class="btn btn-accent btn-block btn-lg">Create Free Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>

      </div>
    </div>
  </section>

  <div id="site-footer" data-include="footer-mini.html"></div>

  <script src="assets/js/includes.js"></script>
  <script src="assets/js/categories-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
